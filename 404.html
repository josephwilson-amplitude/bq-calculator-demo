  // Calculator experiment preview override (?calc_variant=treatment|control), applied before first paint.
  // The live treatment is served by Web Experiment flag "calculator-item-search-improvement" (see README).
  (function () { try {
    var q = new URLSearchParams(location.search).get('calc_variant');
    if (q) localStorage.setItem('bq_calc_variant', JSON.stringify(q));
    if (JSON.parse(localStorage.getItem('bq_calc_variant') || 'null') === 'treatment') document.documentElement.classList.add('calc-improved');
  } catch (e) {} })();
  if (window.amplitude) {
    if (window.sessionReplay) amplitude.add(window.sessionReplay.plugin({ sampleRate: 1 }));
    if (window.engagement)    amplitude.add(window.engagement.plugin());
    amplitude.init("c4f6abd9bf3540b35420fd5018dab420", {
      fetchRemoteConfig: true,
      autocapture: {
        attribution: true, pageViews: true, sessions: true, formInteractions: true, fileDownloads: true,
        elementInteractions: true, frustrationInteractions: true,
        // Failed API calls (4xx/5xx) and requests with no response (0) feed Session Replay error analytics
        networkTracking: { captureRules: [{ statusCodeRange: "0,400-599" }] }
      }
    });
  }
</script>
