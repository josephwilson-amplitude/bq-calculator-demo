<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Analytics + Session Replay (unified smart loader) -->
<script src="https://cdn.amplitude.com/script/c4f6abd9bf3540b35420fd5018dab420.js"></script>
<!-- Web Experiment — required for the visual editor to attach -->
<script src="https://cdn.amplitude.com/script/c4f6abd9bf3540b35420fd5018dab420.experiment.js"></script>
<!-- Guides & Surveys -->
<script src="https://cdn.amplitude.com/script/c4f6abd9bf3540b35420fd5018dab420.engagement.js"></script>
<script>
  // Calculator experiment preview override (?calc_variant=treatment|control), applied before first paint.
  // The live treatment is served by Web Experiment flag "calculator-item-search-improvement" (see README).
  (function () { try {
    var q = new URLSearchParams(location.search).get('calc_variant');
    if (q) localStorage.setItem('bq_calc_variant', JSON.stringify(q));
    if (JSON.parse(localStorage.getItem('bq_calc_variant') || 'null') === 'treatment') document.documentElement.classList.add('calc-improved');
  } catch (e) {} })();
  if (window.amplitude) {
    if (window.sessionReplay) amplitude.add(window.sessionReplay.plugin({ sampleRate: 1 }));
    if (window.engagement)    amplitude.add(window.engagement.plugin());
    amplitude.init("c4f6abd9bf3540b35420fd5018dab420", { fetchRemoteConfig: true, autocapture: true });
  }
</script>
<title>Your basket | DIY at B&amp;Q</title>
<meta name="description" content="DIY products at everyday low prices. Amplitude demo build.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;display=swap">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body data-page="basket">
<div id="site-header"></div>
<main class="wrap" style="padding-top:20px"><div id="basket"></div></main>
<div id="site-footer"></div>
<script src="./assets/js/catalogue.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
